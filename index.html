    input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }

    <!-- Elegant Header (Elevated above watermark) -->
    <header class="px-6 pt-6 pb-4 border-b border-[#ECEAE3] flex items-center justify-between relative z-10 bg-[#FCFCFA]/80 backdrop-blur-xs shrink-0">
      <div>
        <h1 class="text-lg font-medium tracking-wider text-[#2A2927]">菜籃算盤</h1>
        <p class="text-[11px] text-[#8C887E] tracking-widest uppercase mt-0.5">Price Converter & Journal</p>
      </div>
      <div class="flex gap-1 text-[11px] font-medium text-[#7C776E] bg-[#EFECE6] px-2.5 py-0.5 rounded">
        1斤 = 600g
      </div>
    </header>

    <!-- Refined Minimal Tabs -->
    <nav class="flex border-b border-[#ECEAE3] text-xs font-medium text-[#7A766F] bg-[#F7F6F2] relative z-10 shrink-0">
      <button onclick="switchTab('entry')" id="nav-entry" class="flex-1 py-3 text-center border-b-2 border-[#3F5245] text-[#2F3E34] bg-[#FCFCFA] font-bold transition-colors">
        換算與比對
      </button>
      <button onclick="switchTab('history')" id="nav-history" class="flex-1 py-3 text-center border-b-2 border-transparent text-[#8A867E] hover:text-[#2A2927] transition-colors">
        歷次價格庫
      </button>
    </nav>

    <!-- Main Content Body (With fluid custom scrollbar) -->
    <main class="flex-1 overflow-y-auto custom-scroll relative z-10">

      <!-- ================= TAB 1: 換算與比對 ================= -->
      <section id="tab-entry" class="p-5 space-y-4">
        
        <!-- 修改紀錄提示橫條 (預設隱藏) -->
        <div id="edit-banner" class="hidden bg-[#EBF0EC] border border-[#C5D7C9] text-[#2F4F39] text-xs px-3 py-2 rounded-md flex justify-between items-center shadow-2xs">
          <div class="flex items-center gap-1.5 truncate">
            <span class="font-bold whitespace-nowrap">✏️ 正在修改歷史紀錄</span>
            <span id="edit-banner-info" class="text-[11px] text-[#4A6753] truncate"></span>
          </div>
          <button type="button" onclick="cancelEditMode()" class="text-xs text-[#7A766F] hover:text-[#94443E] hover:underline cursor-pointer whitespace-nowrap ml-2">取消修改</button>
        </div>

        <!-- 1. 品項 -->
        <div class="space-y-1.5">
          <div class="flex justify-between items-center text-xs text-[#7A766F]">
            <label class="font-medium">品項</label>
            <div class="flex gap-1.5 text-[11px]">
              <button onclick="setItem('牛番茄')" class="text-[#3F5245] hover:underline font-bold">牛番茄</button>
              <span class="text-[#D6D3CB]">·</span>
              <button onclick="setItem('高麗菜')" class="text-[#3F5245] hover:underline">高麗菜</button>
            </div>
          </div>
          <input type="text" id="inp-name" value="" oninput="onNameOrGlobalChange()" placeholder="輸入蔬果品項 (如牛番茄)" class="w-full bg-white/95 border border-[#DDD9CE] rounded-md px-3 py-2 text-sm font-medium text-[#2A2927] focus:outline-none focus:border-[#3F5245] transition-colors">
        </div>

        <!-- 2. 通路：果菜批發(預設) -> 一般市場 -> 賣場/超市(下拉選單) -->
        <div class="space-y-1.5">
          <div class="flex justify-between items-center text-xs text-[#7A766F]">
            <label class="font-medium">通路</label>
            <span id="lbl-market-selected" class="text-[11px] text-[#3F5245] font-semibold"></span>
          </div>
          <div class="grid grid-cols-3 gap-2">
            <!-- 果菜批發 -->
            <button type="button" onclick="selectPrimaryChannel('果菜批發')" id="btn-chan-果菜批發" class="chan-btn py-2 text-xs rounded-md border border-[#3F5245] bg-[#3F5245] text-white font-medium transition-all">
              果菜批發
            </button>
            <!-- 一般市場 -->
            <button type="button" onclick="selectPrimaryChannel('一般市場')" id="btn-chan-一般市場" class="chan-btn py-2 text-xs rounded-md border border-[#DDD9CE] bg-white/95 text-[#635F57] hover:border-[#3F5245] transition-all">
              一般市場
            </button>
            <!-- 賣場/超市 (標準按鈕，點擊100%可靠切換) -->
            <button type="button" onclick="selectPrimaryChannel('賣場/超市')" id="btn-chan-賣場" class="chan-btn py-2 px-1 text-xs rounded-md border border-[#DDD9CE] bg-white/95 text-[#635F57] font-medium hover:border-[#3F5245] transition-all flex items-center justify-center gap-1 shadow-2xs">
              <span id="btn-chan-market-label">賣場: 萬家福</span>
              <span id="btn-chan-market-arrow" class="text-[9px] text-[#8C887E]">▼</span>
            </button>
          </div>

          <!-- 賣場品牌子選單（當選擇賣場/超市時自動優雅展開） -->
          <div id="supermarket-brands-row" class="hidden pt-1">
            <div class="flex items-center gap-1.5 overflow-x-auto pb-0.5 no-scrollbar">
              <span class="text-[10px] text-[#8C887E] whitespace-nowrap pl-0.5">品牌：</span>
              <div id="supermarket-pills" class="flex gap-1.5">
                <!-- 由 JS 動態渲染品牌膠囊按鈕 -->
              </div>
            </div>
          </div>
        </div>

        <!-- 3. 輸入區域：重新美化為 2x2 寬敞雙列佈局，徹底解決斷行擠壓，單價單位與重量單位連動！ -->
        <div class="bg-white/95 backdrop-blur-xs border border-[#E6E3DB] rounded-md p-4 space-y-3.5 shadow-xs">
          
          <div class="flex justify-between items-center text-[11px] font-medium text-[#8C887E]">
            <span id="card-mode-title" class="tracking-wide uppercase">價格與重量換算 (任填兩項自動互算)</span>
            <button onclick="clearInputs()" class="text-[#8C887E] hover:text-[#2A2927]">清除</button>
          </div>

          <!-- 2x2 寬敞佈局：第一列（單價 + 重量） -->
          <div class="grid grid-cols-2 gap-3">
            
            <!-- 欄位 1: 單價 (含單位切換：台斤、公斤、100g、公克) -->
            <div class="space-y-1">
              <div class="flex justify-between items-center">
                <label class="text-xs font-medium text-[#615D56]">單價</label>
                <!-- 單價單位選擇：台斤、公克、公斤 -->
                <select id="sel-price-unit" onchange="onPriceUnitChange()" class="text-[11px] bg-transparent text-[#3F5245] font-semibold focus:outline-none cursor-pointer">
                  <option value="jin">元 / 台斤</option>
                  <option value="g">元 / 公克</option>
                  <option value="kg">元 / 公斤</option>
                </select>
              </div>
              <div class="relative flex items-center">
                <span class="absolute left-2.5 text-xs text-[#9B978F] font-bold">$</span>
                <input type="number" id="inp-unit-price" value="" placeholder="單價" oninput="onFieldInput('unit')" class="w-full bg-[#FAF9F5] border border-[#DDD9CE] rounded-md pl-6 pr-14 py-2 text-sm font-semibold text-[#2A2927] focus:outline-none focus:border-[#3F5245] focus:bg-white transition-colors">
                <span id="lbl-price-unit-suffix" class="absolute right-2 text-[10px] text-[#8C887E]">/ 斤</span>
              </div>
            </div>

            <!-- 欄位 2: 秤出重量 (含單位切換：台斤、公克、公斤) -->
            <div class="space-y-1">
              <div class="flex justify-between items-center">
                <label class="text-xs font-medium text-[#615D56]">重量</label>
                <!-- 重量單位選擇 -->
                <select id="sel-weight-unit" onchange="onWeightUnitChange()" class="text-[11px] bg-transparent text-[#3F5245] font-semibold focus:outline-none cursor-pointer">
                  <option value="jin">台斤</option>
                  <option value="g">公克 (g)</option>
                  <option value="kg">公斤 (kg)</option>
                </select>
              </div>
              <div class="relative flex items-center">
                <input type="number" step="0.01" id="inp-weight" value="" placeholder="重量" oninput="onFieldInput('weight')" class="w-full bg-[#FAF9F5] border border-[#DDD9CE] rounded-md px-2.5 py-2 text-sm font-semibold text-[#2A2927] focus:outline-none focus:border-[#3F5245] focus:bg-white transition-colors">
                <span id="lbl-weight-unit-suffix" class="absolute right-2.5 text-[10px] text-[#8C887E]">斤</span>
              </div>
            </div>

          </div>

          <!-- 2x2 寬敞佈局：第二列（秤出總價 + 內含顆數） -->
          <div class="grid grid-cols-2 gap-3 pt-1 border-t border-[#F5F2EA]">
            
            <!-- 欄位 3: 總價 -->
            <div class="space-y-1">
              <label class="block text-xs font-medium text-[#615D56]">總金額</label>
              <div class="relative flex items-center">
                <span class="absolute left-2.5 text-xs text-[#9B978F] font-bold">$</span>
                <input type="number" id="inp-total-price" value="" placeholder="總價" oninput="onFieldInput('total')" class="w-full bg-[#FAF9F5] border border-[#DDD9CE] rounded-md pl-6 pr-8 py-2 text-sm font-semibold text-[#2A2927] focus:outline-none focus:border-[#3F5245] focus:bg-white transition-colors">
                <span class="absolute right-2 text-[10px] text-[#8C887E]">元</span>
              </div>
            </div>

            <!-- 欄位 4: 顆數選填 (算單顆均價) -->
            <div class="space-y-1">
              <label class="block text-xs font-medium text-[#615D56]">顆數 <span class="text-[10px] text-[#8C887E] font-normal">(選填算單顆)</span></label>
              <div class="relative flex items-center">
                <input type="number" id="inp-piece-count" value="" placeholder="選填" oninput="recalcUniversal()" class="w-full bg-[#FAF9F5] border border-[#DDD9CE] rounded-md px-2.5 py-2 text-sm font-semibold text-[#2A2927] focus:outline-none focus:border-[#3F5245] focus:bg-white transition-colors">
                <span class="absolute right-2 text-[10px] text-[#8C887E]">顆</span>
              </div>
            </div>

          </div>

          <!-- 推算狀態列 -->
          <div id="hint-calc-bar" class="text-xs text-[#526659] bg-[#F3F6F4] px-3 py-1.5 rounded-md flex justify-between items-center">
            <span id="hint-calc-text">請輸入任兩項進行自動換算</span>
            <span id="hint-calc-extra" class="text-[11px] text-[#7A8E81]"></span>
          </div>

        </div>

        <!-- 4. 換算結果 (2/3 寬度) 與 儲存按鈕 (1/3 寬度) 並排精簡佈局 -->
        <div class="grid grid-cols-3 gap-2.5 items-stretch">
          
          <!-- 左側 2/3: 換算單價展示 (支援每顆均價與均重) -->
          <div class="col-span-2 bg-white/95 backdrop-blur-xs border border-[#E4E1D8] rounded-md p-3 shadow-xs flex flex-col justify-between">
            <div>
              <span id="rate-jin-title" class="text-[10px] text-[#8A867E] block mb-0.5">折合每台斤</span>
              <div class="flex items-baseline gap-1">
                <span class="text-xl font-semibold tracking-tight text-[#24332A]">$</span>
                <span class="text-2xl font-semibold tracking-tight text-[#24332A]" id="rate-jin">-</span>
                <span id="rate-jin-unit" class="text-xs text-[#8A867E]">/ 斤</span>
              </div>
            </div>

            <!-- 單顆均價與均重（填寫顆數時才顯示） -->
            <div id="piece-stat-box" class="pt-1.5 mt-1.5 border-t border-[#F0ECE4] flex flex-col gap-0.5 text-[11px] hidden">
              <div class="flex items-center gap-1 text-[#5C5851]">
                <span class="w-1.5 h-1.5 rounded-full bg-[#3F5245]"></span>
                <span>單顆約 <strong id="stat-piece-price" class="font-semibold text-[#24332A]">$0.0</strong> / 顆</span>
              </div>
              <div class="text-[10px] text-[#8A867E]">
                平均約 <strong id="stat-piece-weight" class="text-[#4A4742]">0</strong> g / 顆
              </div>
            </div>
          </div>

          <!-- 右側 1/3: 儲存本次紀錄按鈕 (支援切換為更新紀錄) -->
          <button id="btn-save-record" onclick="saveRecord()" class="col-span-1 bg-[#3F5245] hover:bg-[#344439] active:bg-[#2A372E] text-white rounded-md p-2.5 flex flex-col items-center justify-center gap-1 transition-all shadow-xs group cursor-pointer">
            <svg id="btn-save-icon" class="w-5 h-5 text-white/90 group-hover:scale-110 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
            </svg>
            <span id="btn-save-text" class="text-xs font-medium tracking-wide text-center leading-tight">儲存<br>紀錄</span>
          </button>

        </div>

        <!-- 5. 歷次比對：置於最底部，隨意瀏覽 -->
        <div id="compare-box" class="bg-[#F5F4EE]/90 backdrop-blur-xs border border-[#E5E2D8] rounded-md p-3 space-y-2">
          <div class="flex justify-between items-center text-xs">
            <span class="font-medium text-[#5E5A52]">各通路最近紀錄比對 (<span id="cmp-target-name">蔬果</span>)</span>
            <span class="text-[10px] text-[#8A867E]">以當前單價為基準</span>
          </div>

          <!-- 通路列表容器 -->
          <div id="channels-compare-list" class="space-y-1 bg-white/80 rounded-md p-2 border border-[#EAE7DF] text-xs">
            <!-- Dynamically populated rows -->
          </div>

          <!-- 歷史行情摘要 -->
          <div class="flex justify-between text-[11px] text-[#7A766F] px-1 pt-0.5">
            <span>歷史最低：$<strong id="cmp-min-rate" class="font-medium text-[#2F4F39]">-</strong> (<span id="cmp-min-chan">-</span>)</span>
            <span>平均：$<strong id="cmp-avg-rate" class="font-medium text-[#3A3834]">-</strong> / 斤</span>
          </div>
        </div>

      </section>


      <!-- ================= TAB 2: 歷次價格庫 (Sticky filter & fluid scrolling) ================= -->
      <section id="tab-history" class="p-5 space-y-3 hidden">
        
        <!-- Sticky Search & Filter Header -->
        <div class="sticky -top-5 pt-1 pb-2 bg-[#FCFCFA] z-20 space-y-2 border-b border-[#F0ECE4]/80">
          <div class="flex gap-2">
            <input type="text" id="hist-search" oninput="renderHistory()" placeholder="搜尋蔬果品項 (如高麗菜、牛番茄)..." class="flex-1 bg-white border border-[#DDD9CE] rounded-md px-3 py-1.5 text-xs text-[#2A2927] focus:outline-none focus:border-[#3F5245]">
            
            <select id="hist-chan-filter" onchange="renderHistory()" class="bg-white border border-[#DDD9CE] rounded-md px-2.5 py-1.5 text-xs text-[#4A4742] focus:outline-none cursor-pointer">
              <option value="all">全部通路</option>
              <option value="果菜批發">果菜批發</option>
              <option value="一般市場">一般市場</option>
              <option value="萬家福">萬家福</option>
              <option value="美聯社">美聯社</option>
              <option value="喜互惠">喜互惠</option>
              <option value="全聯">全聯</option>
              <option value="樂家康">樂家康</option>
              <option value="其他">其他</option>
            </select>
          </div>

          <!-- Count and clear -->
          <div class="text-[11px] text-[#8C887E] px-0.5 flex flex-wrap justify-between items-center gap-2">
            <span>已累積 <strong id="hist-total-count" class="text-[#2A2927]">0</strong> 筆歷史紀錄</span>
            <div class="flex flex-wrap justify-end gap-x-3 gap-y-1">
              <button onclick="exportRecords()" class="hover:underline text-[#3F5245] transition-colors">匯出備份</button>
              <button onclick="document.getElementById('import-file').click()" class="hover:underline text-[#3F5245] transition-colors">匯入／還原</button>
              <input id="import-file" type="file" accept=".json,application/json" onchange="importRecordsFromFile(event)" class="hidden" aria-label="選擇菜籃算盤備份檔">
              <button onclick="clearAllRecords()" class="hover:underline text-[#9B978F] hover:text-[#94443E] transition-colors">清空所有紀錄</button>
            </div>
          </div>
        </div>

        <!-- History Records Container (Scrollable) -->
        <div id="history-container" class="space-y-2 pt-1 pb-6">
          <!-- Populated by JS -->
        </div>

      </section>

    </main>

    <!-- Refined Minimal Toast -->
    <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-[#2D2B29] text-[#F9F8F5] text-xs px-3.5 py-1.5 rounded-md shadow-xs pointer-events-none opacity-0 transition-opacity duration-200 z-50">
      已儲存紀錄
    </div>

  </div>

  <script>
    const PRIMARY_CHANNELS = ['果菜批發', '一般市場', '賣場/超市'];
    const SUPERMARKET_BRANDS = ['萬家福', '美聯社', '喜互惠', '全聯', '樂家康', '其他'];
    let activePrimary = '果菜批發'; // '果菜批發' | '一般市場' | '賣場/超市'
    let activeSupermarketBrand = '萬家福';
    let activeChannel = '果菜批發'; // The actual channel label used in DB records

    // ================= LocalStorage Data Persistence =================
    const STORAGE_KEY = 'MARKET_VEGGIE_CALC_DATA_V1';

    function loadRecordsFromStorage() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const list = JSON.parse(raw);
          if (Array.isArray(list)) return list;
        }
      } catch (e) {
        console.warn('LocalStorage load failed:', e);
      }
      return []; // 正式版初始預設 0 筆乾淨空白
    }

    function saveRecordsToStorage(nextRecords) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(nextRecords));
        return true;
      } catch (e) {
        console.warn('LocalStorage save failed:', e);
        showToast('儲存失敗，請確認瀏覽器儲存空間');
        return false;
      }
    }

    function exportRecords() {
      const blob = new Blob([JSON.stringify(records, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = `菜籃算盤備份-${new Date().toLocaleDateString('sv-SE')}.json`;
      document.body.appendChild(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    function isValidBackup(list) {
      if (!Array.isArray(list)) return false;
      const seenIds = new Set();
      const channels = ['果菜批發', '一般市場', ...SUPERMARKET_BRANDS];
      const units = ['jin', 'kg', 'g'];
      const numericFields = ['rate', 'rate100g', 'unitPrice', 'weightVal', 'weightG', 'totalPrice', 'piecePrice', 'pieceCount'];
      return list.every(record => {
        if (!record || typeof record !== 'object' || Array.isArray(record)) return false;
        if (!Number.isSafeInteger(record.id) || record.id <= 0 || seenIds.has(record.id)) return false;
        seenIds.add(record.id);
        if (typeof record.date !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(record.date)) return false;
        if (typeof record.name !== 'string' || !record.name.trim()) return false;
        if (!channels.includes(record.channel) || !units.includes(record.priceUnit) || !units.includes(record.weightUnit)) return false;
        if (typeof record.note !== 'string') return false;
        if (!numericFields.every(field => typeof record[field] === 'number' && Number.isFinite(record[field]) && record[field] >= 0)) return false;
        return Number.isInteger(record.pieceCount);
      });
    }

    async function importRecordsFromFile(event) {
      const input = event.target;
      const file = input.files && input.files[0];
      if (!file) return;
      try {
        if (file.size > 20 * 1024 * 1024) {
          showToast('備份檔過大，請選擇 20 MB 以下的 JSON 檔');
          return;
        }
        const imported = JSON.parse(await file.text());
        if (!isValidBackup(imported)) {
          showToast('備份格式不正確，現有紀錄未變更');
          return;
        }
        if (!confirm(`備份有 ${imported.length} 筆紀錄，將取代目前的 ${records.length} 筆紀錄。確定還原嗎？`)) return;
        if (!saveRecordsToStorage(imported)) return;
        records = imported;
        if (editingRecordId !== null) cancelEditMode();
        document.getElementById('hist-search').value = '';
        document.getElementById('hist-chan-filter').value = 'all';
        renderHistory();
        updateComparison();
        showToast(`已還原 ${records.length} 筆紀錄`);
      } catch (error) {
        console.warn('Backup import failed:', error);
        showToast('無法讀取備份檔，現有紀錄未變更');
      } finally {
        input.value = '';
      }
    }

    function deleteRecord(id) {
      if (!confirm('確定刪除此筆紀錄嗎？')) return;
      const nextRecords = records.filter(r => r.id !== id);
      if (!saveRecordsToStorage(nextRecords)) return;
      records = nextRecords;
      renderHistory();
      updateComparison();
      showToast('已刪除紀錄');
    }

    let records = loadRecordsFromStorage();

    function clearAllRecords() {
      if (records.length === 0) {
        showToast('目前已經沒有任何紀錄');
        return;
      }
      if (!confirm('確定要清空所有歷史紀錄嗎？清空後將無法復原。')) return;
      if (!saveRecordsToStorage([])) return;
      records = [];
      renderHistory();
      updateComparison();
      showToast('已清空所有歷史紀錄');
    }

    function showToast(text) {
      const el = document.getElementById('toast');
      el.innerText = text;
      el.classList.remove('opacity-0');
      setTimeout(() => el.classList.add('opacity-0'), 1800);
    }

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, char => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      })[char]);
    }

    function switchTab(tab) {
      if (tab === 'entry') {
        document.getElementById('tab-entry').classList.remove('hidden');
        document.getElementById('tab-history').classList.add('hidden');
        document.getElementById('nav-entry').className = "flex-1 py-3 text-center border-b-2 border-[#3F5245] text-[#2F3E34] bg-[#FCFCFA] font-bold transition-colors";
        document.getElementById('nav-history').className = "flex-1 py-3 text-center border-b-2 border-transparent text-[#8A867E] hover:text-[#2A2927] transition-colors";
      } else {
        document.getElementById('tab-entry').classList.add('hidden');
        document.getElementById('tab-history').classList.remove('hidden');
        document.getElementById('nav-history').className = "flex-1 py-3 text-center border-b-2 border-[#3F5245] text-[#2F3E34] bg-[#FCFCFA] font-bold transition-colors";
        document.getElementById('nav-entry').className = "flex-1 py-3 text-center border-b-2 border-transparent text-[#8A867E] hover:text-[#2A2927] transition-colors";
        renderHistory();
      }
    }

    function setItem(name) {
      document.getElementById('inp-name').value = name;
      onNameOrGlobalChange();
    }

    function renderSupermarketPills() {
      const container = document.getElementById('supermarket-pills');
      if (!container) return;
      container.innerHTML = SUPERMARKET_BRANDS.map(brand => {
        const isActive = (brand === activeSupermarketBrand);
        const activeClass = isActive
          ? 'bg-[#3F5245] text-white border-[#3F5245] font-semibold shadow-2xs'
          : 'bg-white/95 text-[#5C5851] border-[#DDD9CE] hover:border-[#3F5245]';
        return `<button type="button" onclick="switchSupermarketBrand('${brand}')" class="px-2.5 py-0.5 text-[11px] rounded-full border transition-all whitespace-nowrap cursor-pointer ${activeClass}">${brand}</button>`;
      }).join('');
    }

    function switchSupermarketBrand(brand) {
      activeSupermarketBrand = brand;
      activeChannel = brand;
      const lbl = document.getElementById('btn-chan-market-label');
      if (lbl) lbl.innerText = `賣場: ${brand}`;
      renderSupermarketPills();
      const lblSelected = document.getElementById('lbl-market-selected');
      if (lblSelected) lblSelected.innerText = `目前選擇：${activeChannel}`;
      updateComparison();
    }

    function updateChannelUI() {
      const btnWholesale = document.getElementById('btn-chan-果菜批發');
      const btnMarket = document.getElementById('btn-chan-一般市場');
      const btnSuper = document.getElementById('btn-chan-賣場');
      const superArrow = document.getElementById('btn-chan-market-arrow');
      const brandRow = document.getElementById('supermarket-brands-row');
      const lblSelected = document.getElementById('lbl-market-selected');
      const lblBtnSuper = document.getElementById('btn-chan-market-label');

      // Reset base styles
      if (btnWholesale) btnWholesale.className = "chan-btn py-2 text-xs rounded-md border border-[#DDD9CE] bg-white/95 text-[#635F57] hover:border-[#3F5245] transition-all";
      if (btnMarket) btnMarket.className = "chan-btn py-2 text-xs rounded-md border border-[#DDD9CE] bg-white/95 text-[#635F57] hover:border-[#3F5245] transition-all";
      if (btnSuper) btnSuper.className = "chan-btn py-2 px-1 text-xs rounded-md border border-[#DDD9CE] bg-white/95 text-[#635F57] font-medium hover:border-[#3F5245] transition-all flex items-center justify-center gap-1 shadow-2xs cursor-pointer";
      if (superArrow) superArrow.className = "text-[9px] text-[#8C887E]";
      if (lblBtnSuper) lblBtnSuper.innerText = `賣場: ${activeSupermarketBrand}`;

      if (activePrimary === '果菜批發') {
        if (btnWholesale) btnWholesale.className = "chan-btn py-2 text-xs rounded-md border border-[#3F5245] bg-[#3F5245] text-white font-medium transition-all shadow-xs";
        activeChannel = '果菜批發';
        if (lblSelected) lblSelected.innerText = '';
        if (brandRow) brandRow.classList.add('hidden');
      } else if (activePrimary === '一般市場') {
        if (btnMarket) btnMarket.className = "chan-btn py-2 text-xs rounded-md border border-[#3F5245] bg-[#3F5245] text-white font-medium transition-all shadow-xs";
        activeChannel = '一般市場';
        if (lblSelected) lblSelected.innerText = '';
        if (brandRow) brandRow.classList.add('hidden');
      } else {
        // 賣場/超市
        if (btnSuper) btnSuper.className = "chan-btn py-2 px-1 text-xs rounded-md border border-[#3F5245] bg-[#3F5245] text-white font-medium transition-all flex items-center justify-center gap-1 shadow-xs cursor-pointer";
        if (superArrow) superArrow.className = "text-[9px] text-white/80";
        activeChannel = activeSupermarketBrand;
        if (lblSelected) lblSelected.innerText = `目前選擇：${activeChannel}`;
        if (brandRow) brandRow.classList.remove('hidden');
        renderSupermarketPills();
      }
    }

    function selectPrimaryChannel(primary) {
      activePrimary = primary;
      if (primary === '賣場/超市') {
        activeChannel = activeSupermarketBrand;
        updateChannelUI();
        // Supermarket default: 公克 (g)
        convertDisplayedUnits('g', 'g');
      } else {
        activeChannel = primary;
        updateChannelUI();
        // Wholesale & traditional market default: 台斤 (jin)
        convertDisplayedUnits('jin', 'jin');
      }
    }

    function activateSupermarket(brand) {
      activePrimary = '賣場/超市';
      if (brand) activeSupermarketBrand = brand;
      selectPrimaryChannel('賣場/超市');
    }

    // ================= Universal Unit & 3-Way Auto-Resolver =================
    // Tracks the sequence of the 2 fields directly input by the user (e.g. ['weight', 'total'])
    let userEditedFields = [];
    let curRateJin = 0;
    let curRate100g = 0;
    let curPiecePrice = 0;
    let curPieceWeight = 0;
    let curNote = '';
    let lastPriceUnit = 'jin';
    let lastWeightUnit = 'jin';
    const GRAMS_PER_UNIT = { jin: 600, kg: 1000, g: 1 };

    function convertDisplayedUnits(priceUnit, weightUnit) {
      const priceEl = document.getElementById('inp-unit-price');
      const weightEl = document.getElementById('inp-weight');
      if (priceEl.value !== '' && lastPriceUnit !== priceUnit) {
        priceEl.value = parseFloat((Number(priceEl.value) * GRAMS_PER_UNIT[priceUnit] / GRAMS_PER_UNIT[lastPriceUnit]).toFixed(8));
      }
      if (weightEl.value !== '' && lastWeightUnit !== weightUnit) {
        weightEl.value = parseFloat((Number(weightEl.value) * GRAMS_PER_UNIT[lastWeightUnit] / GRAMS_PER_UNIT[weightUnit]).toFixed(8));
      }
      lastPriceUnit = priceUnit;
      lastWeightUnit = weightUnit;
      document.getElementById('sel-price-unit').value = priceUnit;
      document.getElementById('sel-weight-unit').value = weightUnit;
      syncSuffixLabels();
      recalcUniversal();
    }

    function syncSuffixLabels() {
      const pUnit = document.getElementById('sel-price-unit').value;
      const wUnit = document.getElementById('sel-weight-unit').value;

      const pMap = { jin: '/ 斤', kg: '/ kg', g: '/ g' };
      const wMap = { jin: '斤', kg: 'kg', g: 'g' };

      document.getElementById('lbl-price-unit-suffix').innerText = pMap[pUnit] || '/ 斤';
      document.getElementById('lbl-weight-unit-suffix').innerText = wMap[wUnit] || '斤';
    }

    // When price unit dropdown changes: 右邊的重量單位自動 1:1 跟隨變動！
    function onPriceUnitChange() {
      const pUnit = document.getElementById('sel-price-unit').value;
      convertDisplayedUnits(pUnit, pUnit);
    }

    // When weight unit dropdown changes
    function onWeightUnitChange() {
      convertDisplayedUnits(document.getElementById('sel-price-unit').value, document.getElementById('sel-weight-unit').value);
    }

    function clearInputs() {
      userEditedFields = [];
      document.getElementById('inp-unit-price').value = '';
      document.getElementById('inp-weight').value = '';
      document.getElementById('inp-total-price').value = '';
      document.getElementById('inp-piece-count').value = '';
      document.getElementById('hint-calc-text').innerText = '請輸入任兩項進行計算';
      document.getElementById('hint-calc-extra').innerText = '';
      curRateJin = 0;
      curRate100g = 0;
      curPiecePrice = 0;
      curPieceWeight = 0;
      updateDisplayAndComparison();
    }

    function onFieldInput(field) {
      const inputId = (field === 'unit') ? 'inp-unit-price' : (field === 'weight') ? 'inp-weight' : 'inp-total-price';
      const rawVal = document.getElementById(inputId).value.trim();

      if (rawVal === '' || isNaN(parseFloat(rawVal))) {
        // User cleared this field
        userEditedFields = userEditedFields.filter(f => f !== field);
      } else {
        // User inputted or modified this field
        userEditedFields = userEditedFields.filter(f => f !== field);
        userEditedFields.push(field);
        while (userEditedFields.length > 2) userEditedFields.shift();
      }

      recalcUniversal();
    }

    // Helper: Convert current input weight to grams
    function getWeightInGrams() {
      const raw = parseFloat(document.getElementById('inp-weight').value) || 0;
      const unit = document.getElementById('sel-weight-unit').value;
      if (unit === 'jin') return raw * 600;
      if (unit === 'kg') return raw * 1000;
      return raw; // g
    }

    // Helper: Set weight input from grams
    function setWeightFromGrams(gramsVal) {
      const unit = document.getElementById('sel-weight-unit').value;
      const el = document.getElementById('inp-weight');
      if (unit === 'jin') {
        el.value = parseFloat((gramsVal / 600).toFixed(6));
      } else if (unit === 'kg') {
        el.value = parseFloat((gramsVal / 1000).toFixed(6));
      } else {
        el.value = Math.round(gramsVal * 100) / 100;
      }
    }

    // Helper: Get Price per Gram from the unit-price field
    function getPricePerGram() {
      const raw = parseFloat(document.getElementById('inp-unit-price').value) || 0;
      const pUnit = document.getElementById('sel-price-unit').value;
      if (pUnit === 'jin') return raw / 600;
      if (pUnit === 'kg') return raw / 1000;
      return raw; // per g
    }

    // Helper: Set Unit Price field from Price per Gram
    function setUnitPriceFromPricePerGram(pricePerGram) {
      const pUnit = document.getElementById('sel-price-unit').value;
      const el = document.getElementById('inp-unit-price');
      if (pUnit === 'jin') {
        el.value = parseFloat((pricePerGram * 600).toFixed(1));
      } else if (pUnit === 'kg') {
        el.value = parseFloat((pricePerGram * 1000).toFixed(1));
      } else {
        el.value = parseFloat(pricePerGram.toFixed(8));
      }
    }

    // Main 3-Way Auto-Resolver across any unit combination
    function recalcUniversal() {
      const unitPriceEl = document.getElementById('inp-unit-price');
      const weightEl = document.getElementById('inp-weight');
      const totalEl = document.getElementById('inp-total-price');
      const pieceEl = document.getElementById('inp-piece-count');

      const hintText = document.getElementById('hint-calc-text');
      const hintExtra = document.getElementById('hint-calc-extra');

      // Pieces breakdown (can be calculated whenever total and piece count exist!)
      let t = parseFloat(totalEl.value);
      let pieces = Number(pieceEl.value);
      let wG = getWeightInGrams();
      let pG = getPricePerGram();
      curRateJin = 0;
      curRate100g = 0;
      curPiecePrice = 0;
      curPieceWeight = 0;

      // If fewer than 2 user-edited fields:
      if (userEditedFields.length < 2) {
        // Clear whatever field was NOT explicitly entered by user
        ['unit', 'weight', 'total'].forEach(f => {
          if (!userEditedFields.includes(f)) {
            if (f === 'unit') unitPriceEl.value = '';
            if (f === 'weight') weightEl.value = '';
            if (f === 'total') totalEl.value = '';
          }
        });

        t = parseFloat(totalEl.value);
        wG = getWeightInGrams();
        if (Number.isInteger(pieces) && pieces > 0 && t > 0) {
          curPiecePrice = parseFloat((t / pieces).toFixed(1));
          curPieceWeight = wG > 0 ? Math.round(wG / pieces) : 0;
        }

        if (userEditedFields.length === 1) {
          const f = userEditedFields[0];
          if (f === 'total') {
            if (pieces > 0 && curPiecePrice > 0) {
              hintText.innerText = `總額 $${t} ÷ ${pieces}顆 = 均價 $${curPiecePrice}/顆`;
              hintExtra.innerText = `可直接儲存紀錄，亦可補填重量換算斤價`;
            } else {
              hintText.innerText = `已輸入總額 $${t} 元`;
              hintExtra.innerText = `可直接儲存，或輸入重量/單價自動互算`;
            }
          } else if (f === 'unit') {
            const rawU = parseFloat(unitPriceEl.value);
            pG = getPricePerGram();
            curRateJin = pG * 600;
            curRate100g = pG * 100;
            hintText.innerText = `已設定單價 $${rawU}`;
            hintExtra.innerText = `折合每斤 $${curRateJin.toFixed(1)}，可直接儲存`;
          } else {
            hintText.innerText = `已輸入重量`;
            hintExtra.innerText = `請再輸入單價或總額以自動互算`;
          }
        } else {
          hintText.innerText = `請輸入任兩項進行計算`;
          hintExtra.innerText = ``;
          curRateJin = 0;
          curRate100g = 0;
        }

        updateDisplayAndComparison();
        return;
      }

      // Exactly 2 user-edited fields -> targetField is the single field to solve!
      const targetField = ['unit', 'weight', 'total'].find(f => !userEditedFields.includes(f));

      if (targetField === 'unit') {
        // Solve unit price = total / weight
        if (t > 0 && wG > 0) {
          pG = t / wG;
          setUnitPriceFromPricePerGram(pG);
          hintText.innerText = `總額 $${t} ÷ 重量 = 單價`;
          hintExtra.innerText = `折合每斤 $${(pG * 600).toFixed(1)}`;
        }
      } else if (targetField === 'weight') {
        // Solve weight = total / unit price
        if (t > 0 && pG > 0) {
          wG = t / pG;
          setWeightFromGrams(wG);
          hintText.innerText = `總額 $${t} ÷ 單價 = 重量`;
          hintExtra.innerText = `約 ${Math.round(wG)}g (${(wG / 600).toFixed(2)}斤)`;
        }
      } else if (targetField === 'total') {
        // Solve total = unit price * weight
        if (wG > 0 && pG > 0) {
          t = Math.round(pG * wG);
          totalEl.value = t;
          hintText.innerText = `單價 × 重量 = 總額 $${t} 元`;
          hintExtra.innerText = `約 ${wG >= 1000 ? (wG / 1000).toFixed(2) + 'kg' : Math.round(wG) + 'g'}`;
        }
      }

      // Re-read calculated values
      pG = getPricePerGram();
      wG = getWeightInGrams();
      t = parseFloat(totalEl.value) || 0;

      curRateJin = pG * 600;
      curRate100g = pG * 100;

      if (Number.isInteger(pieces) && pieces > 0 && t > 0) {
        curPiecePrice = parseFloat((t / pieces).toFixed(1));
        curPieceWeight = wG > 0 ? Math.round(wG / pieces) : 0;
      }

      // Format Note
      const pUnit = document.getElementById('sel-price-unit').value;
      const wUnit = document.getElementById('sel-weight-unit').value;
      const pSuffix = { jin: '/斤', kg: '/kg', g: '/g' }[pUnit] || '';
      const wSuffix = { jin: '斤', kg: 'kg', g: 'g' }[wUnit] || '';

      let noteParts = [];
      const finalRawU = parseFloat(unitPriceEl.value);
      const finalRawW = parseFloat(weightEl.value);
      if (!isNaN(finalRawU) && finalRawU > 0) noteParts.push(`$${unitPriceEl.value}${pSuffix}`);
      if (!isNaN(finalRawW) && finalRawW > 0) noteParts.push(`${weightEl.value}${wSuffix}`);
      if (t > 0) noteParts.push(`總價$${t}`);
      if (pieces > 0 && curPiecePrice > 0) noteParts.push(`(${pieces}顆, 均價$${curPiecePrice})`);
      curNote = noteParts.join(' ');

      updateDisplayAndComparison();
    }

    function onNameOrGlobalChange() {
      recalcUniversal();
    }

    function updateDisplayAndComparison() {
      const titleEl = document.getElementById('rate-jin-title');
      const rateEl = document.getElementById('rate-jin');
      const unitEl = document.getElementById('rate-jin-unit');

      if (curRateJin > 0) {
        if (titleEl) titleEl.innerText = '折合每台斤';
        if (rateEl) rateEl.innerText = curRateJin.toFixed(1);
        if (unitEl) unitEl.innerText = '/ 斤';
      } else if (curPiecePrice > 0) {
        if (titleEl) titleEl.innerText = '單顆平均價';
        if (rateEl) rateEl.innerText = curPiecePrice.toFixed(1);
        if (unitEl) unitEl.innerText = '/ 顆';
      } else {
        const t = parseFloat(document.getElementById('inp-total-price').value);
        if (!isNaN(t) && t > 0) {
          if (titleEl) titleEl.innerText = '輸入總金額';
          if (rateEl) rateEl.innerText = t;
          if (unitEl) unitEl.innerText = '元';
        } else {
          if (titleEl) titleEl.innerText = '折合每台斤';
          if (rateEl) rateEl.innerText = '-';
          if (unitEl) unitEl.innerText = '/ 斤';
        }
      }

      const pieceBox = document.getElementById('piece-stat-box');
      // Show sub-box only if per-jin rate AND piece stats both exist
      if (curRateJin > 0 && curPiecePrice > 0) {
        pieceBox.classList.remove('hidden');
        document.getElementById('stat-piece-price').innerText = `$${curPiecePrice.toFixed(1)}`;
        document.getElementById('stat-piece-weight').innerText = curPieceWeight > 0 ? curPieceWeight : '-';
      } else {
        pieceBox.classList.add('hidden');
      }

      updateComparison();
    }

    function updateComparison() {
      const name = (document.getElementById('inp-name').value || '').trim();
      document.getElementById('cmp-target-name').innerText = name || '蔬果';

      const pastRecordsForName = records.filter(r => r.name === name);
      const listContainer = document.getElementById('channels-compare-list');

      let ratesFound = [];

      // Channels to compare: Always 果菜批發 & 一般市場, plus active supermarket or supermarkets that have records
      let compareChannels = ['果菜批發', '一般市場'];
      if (SUPERMARKET_BRANDS.includes(activeChannel)) {
        compareChannels.push(activeChannel);
      }
      SUPERMARKET_BRANDS.forEach(b => {
        if (!compareChannels.includes(b) && pastRecordsForName.some(r => r.channel === b)) {
          compareChannels.push(b);
        }
      });
      // If no supermarket added yet, add default 萬家福
      if (!compareChannels.some(c => SUPERMARKET_BRANDS.includes(c))) {
        compareChannels.push('萬家福');
      }

      const rowsHtml = compareChannels.map(chan => {
        const match = pastRecordsForName.find(r => r.channel === chan);
        const isCurrentActive = (chan === activeChannel);
        const activeMarker = isCurrentActive ? `<span class="w-1.5 h-1.5 rounded-full bg-[#3F5245]"></span>` : `<span class="w-1.5 h-1.5"></span>`;

        if (!match) {
          return `
            <div class="flex items-center justify-between py-1 px-1 border-b border-[#F0ECE4] last:border-0 opacity-60">
              <div class="flex items-center gap-2">
                ${activeMarker}
                <span class="font-medium text-[#7A766F]">${chan}</span>
                <span class="text-[10px] text-[#A39F97]">無紀錄</span>
              </div>
              <div class="text-[11px] text-[#A39F97]">-</div>
            </div>
          `;
        }

        let displayPrice = '';
        if (match.rate > 0) {
          ratesFound.push({ chan: chan, rate: match.rate });
          displayPrice = `$${match.rate.toFixed(1)} <span class="text-[10px] text-[#8A867E] font-normal">/斤</span>`;
        } else if (match.piecePrice > 0) {
          displayPrice = `$${match.piecePrice.toFixed(1)} <span class="text-[10px] text-[#8A867E] font-normal">/顆</span>`;
        } else if (match.totalPrice > 0) {
          displayPrice = `$${match.totalPrice} <span class="text-[10px] text-[#8A867E] font-normal">總額</span>`;
        } else {
          displayPrice = `-`;
        }

        let diffText = '';
        let diffColor = 'text-[#7A766F]';

        if (curRateJin > 0 && match.rate > 0) {
          const diff = curRateJin - match.rate;
          if (Math.abs(diff) < 0.1) {
            diffText = '持平';
            diffColor = 'text-[#7A766F]';
          } else if (diff < 0) {
            const pct = ((Math.abs(diff) / match.rate) * 100).toFixed(0);
            diffText = `省 $${Math.abs(diff).toFixed(1)} (-${pct}%)`;
            diffColor = 'text-[#386148] font-semibold';
          } else {
            const pct = ((diff / match.rate) * 100).toFixed(0);
            diffText = `貴 $${diff.toFixed(1)} (+${pct}%)`;
            diffColor = 'text-[#8F4843] font-semibold';
          }
        } else if (curPiecePrice > 0 && match.piecePrice > 0) {
          const diff = curPiecePrice - match.piecePrice;
          if (Math.abs(diff) < 0.1) {
            diffText = '持平';
            diffColor = 'text-[#7A766F]';
          } else if (diff < 0) {
            diffText = `每顆省 $${Math.abs(diff).toFixed(1)}`;
            diffColor = 'text-[#386148] font-semibold';
          } else {
            diffText = `每顆貴 $${diff.toFixed(1)}`;
            diffColor = 'text-[#8F4843] font-semibold';
          }
        }

        return `
          <div class="flex items-center justify-between py-1 px-1 border-b border-[#F0ECE4] last:border-0 hover:bg-white/50 transition-colors">
            <div class="flex items-center gap-1.5">
              ${activeMarker}
              <span class="font-medium ${isCurrentActive ? 'text-[#2A2927] font-bold' : 'text-[#5C5851]'}">${chan}</span>
                 <span class="text-[10px] text-[#A39F97]">${escapeHtml(String(match.date).substring(5))}</span>
            </div>
            <div class="flex items-center gap-3">
              <span class="font-semibold text-[#2A2927]">${displayPrice}</span>
              <span class="text-[11px] ${diffColor} w-24 text-right">${diffText}</span>
            </div>
          </div>
        `;
      }).join('');

      listContainer.innerHTML = rowsHtml;

      if (ratesFound.length > 0) {
        let minR = ratesFound.reduce((prev, curr) => curr.rate < prev.rate ? curr : prev);
        let avgR = ratesFound.reduce((acc, curr) => acc + curr.rate, 0) / ratesFound.length;

        document.getElementById('cmp-min-rate').innerText = minR.rate.toFixed(1);
        document.getElementById('cmp-min-chan').innerText = minR.chan;
        document.getElementById('cmp-avg-rate').innerText = avgR.toFixed(1);
      } else {
        document.getElementById('cmp-min-rate').innerText = '-';
        document.getElementById('cmp-min-chan').innerText = '-';
        document.getElementById('cmp-avg-rate').innerText = '-';
      }
    }

    let editingRecordId = null;

    function startEditRecord(id) {
      const rec = records.find(r => r.id === id);
      if (!rec) return;

      editingRecordId = id;

      // 1. Switch to entry tab
      switchTab('entry');

      // 2. Prefill name
      document.getElementById('inp-name').value = rec.name || '';

      // 3. Set channel
      if (rec.channel === '果菜批發' || rec.channel === '一般市場') {
        selectPrimaryChannel(rec.channel);
      } else {
        activeSupermarketBrand = rec.channel;
        activateSupermarket(rec.channel);
      }

      // 4. Prefill fields
      userEditedFields = [];

      const totalEl = document.getElementById('inp-total-price');
      const pieceEl = document.getElementById('inp-piece-count');
      const weightEl = document.getElementById('inp-weight');
      const unitPriceEl = document.getElementById('inp-unit-price');

      totalEl.value = (rec.totalPrice && rec.totalPrice > 0) ? rec.totalPrice : '';
      if (totalEl.value) userEditedFields.push('total');

      pieceEl.value = (rec.pieceCount && rec.pieceCount > 0) ? rec.pieceCount : '';

      // Restore weight if stored
      if (rec.weightVal && rec.weightVal > 0) {
        weightEl.value = rec.weightVal;
        if (rec.weightUnit) document.getElementById('sel-weight-unit').value = rec.weightUnit;
        userEditedFields.push('weight');
      } else if (rec.weightG && rec.weightG > 0) {
        setWeightFromGrams(rec.weightG);
        userEditedFields.push('weight');
      } else {
        weightEl.value = '';
      }

      // Restore unit price if stored
      if (rec.unitPrice && rec.unitPrice > 0) {
        unitPriceEl.value = rec.unitPrice;
        if (rec.priceUnit) document.getElementById('sel-price-unit').value = rec.priceUnit;
        userEditedFields.push('unit');
      } else if (rec.rate && rec.rate > 0 && (!rec.totalPrice || rec.totalPrice <= 0)) {
        unitPriceEl.value = rec.rate.toFixed(1);
        document.getElementById('sel-price-unit').value = 'jin';
        userEditedFields.push('unit');
      } else {
        unitPriceEl.value = '';
      }

      if (userEditedFields.length > 2) userEditedFields = ['weight', 'total'];
      lastPriceUnit = document.getElementById('sel-price-unit').value;
      lastWeightUnit = document.getElementById('sel-weight-unit').value;
      syncSuffixLabels();

      // 5. Update Edit Banner & Save Button UI
      const banner = document.getElementById('edit-banner');
      const bannerInfo = document.getElementById('edit-banner-info');
      if (banner && bannerInfo) {
        banner.classList.remove('hidden');
        bannerInfo.innerText = `（${rec.date} ${rec.name}，可直接在此補填重量）`;
      }

      const btnSaveText = document.getElementById('btn-save-text');
      if (btnSaveText) btnSaveText.innerHTML = '更新<br>紀錄';

      recalcUniversal();

      // If weight was empty, focus weight input to prompt user
      if (!weightEl.value) {
        setTimeout(() => weightEl.focus(), 150);
      }
    }

    function cancelEditMode() {
      editingRecordId = null;
      const banner = document.getElementById('edit-banner');
      if (banner) banner.classList.add('hidden');
      const btnSaveText = document.getElementById('btn-save-text');
      if (btnSaveText) btnSaveText.innerHTML = '儲存<br>紀錄';
      clearInputs();
    }

    function saveRecord() {
      const nameEl = document.getElementById('inp-name');
      const name = (nameEl ? nameEl.value : '').trim();
      if (!name) {
        showToast('請先輸入品項名稱（如：牛番茄）');
        if (nameEl) nameEl.focus();
        return;
      }

      const unitPriceEl = document.getElementById('inp-unit-price');
      const weightEl = document.getElementById('inp-weight');
      const totalEl = document.getElementById('inp-total-price');
      const pieceEl = document.getElementById('inp-piece-count');

      for (const [field, label] of [[unitPriceEl, '單價'], [weightEl, '重量'], [totalEl, '總金額']]) {
        if (field.value !== '' && (!Number.isFinite(Number(field.value)) || Number(field.value) <= 0)) {
          showToast(`${label}必須大於 0`);
          field.focus();
          return;
        }
      }
      if (pieceEl.value !== '' && (!Number.isInteger(Number(pieceEl.value)) || Number(pieceEl.value) <= 0)) {
        showToast('顆數必須是正整數');
        pieceEl.focus();
        return;
      }

      const rawU = parseFloat(unitPriceEl.value);
      const rawW = parseFloat(weightEl.value);
      const t = parseFloat(totalEl.value);
      const pieces = Number(pieceEl.value);
      const wG = getWeightInGrams();

      const hasPrice = (curRateJin > 0) || (!isNaN(t) && t > 0) || (!isNaN(rawU) && rawU > 0) || (curPiecePrice > 0);
      if (!hasPrice) {
        showToast('請至少輸入總金額或單價');
        if (totalEl) totalEl.focus();
        return;
      }

      const now = new Date();
      const today = new Date(now.getTime() - now.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
      const pUnit = document.getElementById('sel-price-unit').value;
      const wUnit = document.getElementById('sel-weight-unit').value;
      const pSuffix = { jin: '/斤', kg: '/kg', g: '/g' }[pUnit] || '';
      const wSuffix = { jin: '斤', kg: 'kg', g: 'g' }[wUnit] || '';

      let noteParts = [];
      if (!isNaN(rawU) && rawU > 0) noteParts.push(`$${unitPriceEl.value}${pSuffix}`);
      if (!isNaN(rawW) && rawW > 0) noteParts.push(`${weightEl.value}${wSuffix}`);
      if (!isNaN(t) && t > 0) noteParts.push(`總計$${t}`);
      if (!isNaN(pieces) && pieces > 0 && curPiecePrice > 0) noteParts.push(`(${pieces}顆, 均價$${curPiecePrice})`);

      let finalNote = noteParts.join(' ');
      if (!finalNote) {
        if (curRateJin > 0) finalNote = `每斤 $${curRateJin.toFixed(1)}`;
        else if (!isNaN(t) && t > 0) finalNote = `總額 $${t}`;
      }

      if (editingRecordId !== null) {
        const idx = records.findIndex(r => r.id === editingRecordId);
        if (idx !== -1) {
          const updated = {
            ...records[idx],
            name: name,
            channel: activeChannel,
            rate: curRateJin > 0 ? curRateJin : 0,
            rate100g: curRate100g > 0 ? curRate100g : 0,
            unitPrice: (!isNaN(rawU) && rawU > 0) ? rawU : 0,
            priceUnit: pUnit,
            weightVal: (!isNaN(rawW) && rawW > 0) ? rawW : 0,
            weightUnit: wUnit,
            weightG: wG > 0 ? wG : 0,
            totalPrice: (!isNaN(t) && t > 0) ? t : 0,
            piecePrice: curPiecePrice > 0 ? curPiecePrice : 0,
            pieceCount: (!isNaN(pieces) && pieces > 0) ? pieces : 0,
            note: finalNote
          };
          const nextRecords = records.slice();
          nextRecords[idx] = updated;
          if (!saveRecordsToStorage(nextRecords)) return;
          records = nextRecords;
          showToast(`已成功更新「${name}」紀錄！`);
          cancelEditMode();
          switchTab('history');
          return;
        }
      }

      // New Record
      const nextRecords = [{
        id: Date.now(),
        date: today,
        name: name,
        channel: activeChannel,
        rate: curRateJin > 0 ? curRateJin : 0,
        rate100g: curRate100g > 0 ? curRate100g : 0,
        unitPrice: (!isNaN(rawU) && rawU > 0) ? rawU : 0,
        priceUnit: pUnit,
        weightVal: (!isNaN(rawW) && rawW > 0) ? rawW : 0,
        weightUnit: wUnit,
        weightG: wG > 0 ? wG : 0,
        totalPrice: (!isNaN(t) && t > 0) ? t : 0,
        piecePrice: curPiecePrice > 0 ? curPiecePrice : 0,
        pieceCount: (!isNaN(pieces) && pieces > 0) ? pieces : 0,
        note: finalNote
      }, ...records];

      if (!saveRecordsToStorage(nextRecords)) return;
      records = nextRecords;

      let toastMsg = `已記錄「${name}」`;
      if (curRateJin > 0) toastMsg += ` $${curRateJin.toFixed(1)}/斤`;
      else if (curPiecePrice > 0) toastMsg += ` ${pieces}顆 均價$${curPiecePrice}/顆`;
      else if (!isNaN(t) && t > 0) toastMsg += ` 總計$${t}`;
      toastMsg += ` (${activeChannel})`;

      showToast(toastMsg);
      updateComparison();
    }

    function renderHistory() {
      const container = document.getElementById('history-container');
      const search = (document.getElementById('hist-search').value || '').trim().toLowerCase();
      const filter = document.getElementById('hist-chan-filter').value;

      const filtered = records.filter(r => {
        const matchName = !search || r.name.toLowerCase().includes(search);
        const matchChan = filter === 'all' || r.channel === filter;
        return matchName && matchChan;
      });

      document.getElementById('hist-total-count').innerText = records.length;

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="py-12 text-center text-xs text-[#A8A49C]">
            查無相關歷史紀錄
          </div>
        `;
        return;
      }

      container.innerHTML = filtered.map(r => {
        const safeId = Number.isSafeInteger(Number(r.id)) ? Number(r.id) : 0;
        const isSupermarket = SUPERMARKET_BRANDS.includes(r.channel);
        const badgeStyle = isSupermarket 
          ? 'bg-[#EAEFF0] text-[#3B5B66] border-[#D1DEE3]'
          : r.channel === '果菜批發'
          ? 'bg-[#EBF0EC] text-[#2F4F39] border-[#D4E0D7]'
          : 'bg-[#F2EFE8] text-[#5C574B] border-[#E0DBD0]';

        let priceTitle = '每台斤';
        let priceValue = '-';
        if (r.rate > 0) {
          priceTitle = '每台斤';
          priceValue = `$${r.rate.toFixed(1)}`;
        } else if (r.piecePrice > 0) {
          priceTitle = '單顆均價';
          priceValue = `$${r.piecePrice.toFixed(1)}`;
        } else if (r.totalPrice > 0) {
          priceTitle = '總額';
          priceValue = `$${r.totalPrice}`;
        }

        return `
          <div class="bg-white/95 border border-[#E8E5DC] rounded-md p-3 space-y-1.5 shadow-2xs hover:border-[#3F5245]/40 transition-colors">
            <div class="flex justify-between items-center text-xs">
              <div class="flex items-center gap-2">
                 <span class="font-semibold text-sm text-[#2A2927]">${escapeHtml(r.name)}</span>
                 <span class="px-1.5 py-0.5 text-[10px] rounded border ${badgeStyle}">${escapeHtml(r.channel)}</span>
              </div>
              <div class="flex items-center gap-1.5">
                 <span class="text-[11px] text-[#A19D94]">${escapeHtml(r.date)}</span>
                 <button onclick="startEditRecord(${safeId})" title="修改或補填此筆紀錄" class="text-[#5C5851] hover:text-[#3F5245] text-xs px-1.5 py-0.5 rounded hover:bg-[#EAE7DF] transition-colors flex items-center gap-0.5 cursor-pointer">
                  <svg class="w-3.5 h-3.5 text-[#3F5245]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg>
                  <span class="text-[11px] font-medium text-[#3F5245]">修改</span>
                </button>
                 <button onclick="deleteRecord(${safeId})" title="刪除此紀錄" class="text-[#B8B4AA] hover:text-[#94443E] text-xs px-1 cursor-pointer">✕</button>
              </div>
            </div>

            <div class="flex justify-between items-baseline pt-1 border-t border-[#F7F5F0]">
               <span class="text-[11px] text-[#7A766F] truncate max-w-[220px]">${escapeHtml(r.note)}</span>
              <div class="text-right">
                <span class="text-xs text-[#8A867E]">${priceTitle}</span>
                <span class="text-base font-semibold text-[#24332A] ml-1">${priceValue}</span>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }



    // Service Worker Registration
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').then((reg) => {
          reg.update();
          console.log('SW registered:', reg.scope);
        }).catch((err) => {
          console.log('SW error:', err);
        });
      });
    }

    // Dismiss Splash Screen smoothly
    window.addEventListener('load', () => {
      setTimeout(() => {
        const splash = document.getElementById('app-splash');
        if (splash) {
          splash.classList.add('opacity-0', 'pointer-events-none');
          setTimeout(() => splash.remove(), 500);
        }
      }, 700);
    });

    document.addEventListener('DOMContentLoaded', () => {
      updateChannelUI();
      syncSuffixLabels();
      recalcUniversal();
    });
  </script>
</body>
</html>
